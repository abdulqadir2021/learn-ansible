- name: Demo on variables
  hosts: localhost
  connection: local
  tasks:
    - name: print URL
      ansible.builtin.debug:
        msg: URL - {{ URL }}
      vars:
        URL: tasks.google.com


- name: Demo on variables - Role variables
  hosts: localhost
  connection: local
  roles:
    - sample


## Precedence
# 1. CLI
# 2. Tasks
# 3. Roles- vars
# 4. Playbook - Play vars
# 5. Roles - defaults

- name: Demo on register variables
  hosts: localhost
  connection: local
  become: yes
  tasks:
    - name: check package
      ansible.builtin.dnf:
        name: zlib
        state: installed
      register: out

    - name: Print out
      ansible.builtin.debug:
        msg: "{{ out }}"

